  // Function to update contacts page content based on language
  function updateContactsContent(language) {
    const contactsTitle = document.getElementById('contacts-title');
    const contactsDescription = document.getElementById('contacts-description');

    const infoSourcesTitle = document.getElementById('info-sources-title');

    const contactUsContent = document.getElementById('contact-us-content');
    const homeLink = document.getElementById('home-link');
    const weatherForecast = document.getElementById('weather-forecast');
	const holidayCalendarLinkNav = document.getElementById('holiday-calendar');
	const weatherMapsLink = document.getElementById('weather-maps');
	    
    if (contactsTitle) {
      contactsTitle.textContent = contactsTranslations[language].contactsTitle;
    }
    
    if (contactsDescription) {
      contactsDescription.textContent = contactsTranslations[language].contactsDescription;
    }
    
    if (contactsNavLink) {
      contactsNavLink.textContent = contactsTranslations[language].contactsLink;
    }

      infoSourcesTitle.textContent = contactsTranslations[language].infoSourcesTitle;
    }

    if (infoSourcesContent) {
      infoSourcesContent.innerHTML = contactsTranslations[language].infoSourcesContent;
    }

    if (contactUsTitle) {
      contactUsTitle.textContent = contactsTranslations[language].contactUsTitle;
    }

    if (contactUsContent) {
      contactUsContent.innerHTML = contactsTranslations[language].contactUsContent;
    }
    
    if (homeLink) {
      homeLink.textContent = contactsTranslations[language].homeLink;
    }
    
    if (weatherForecast) {

	}

    }
	
  if (weatherMapsLink) {
    weatherMapsLink.textContent = contactsTranslations[language].weatherMaps;
  }
    
    // Update page title
    document.title = contactsTranslations[language].contactsTitle + " | Weather Pulse";
  }
  
  // Header initialization for contacts page

  // Function to inherit settings from the calling page
  function inheritSettingsFromParent() {
    // Get saved language from localStorage (same as index.html)
    const savedLanguage = localStorage.getItem('selectedLanguage') || 'bg';
    
    // Apply the inherited language setting
    if (savedLanguage) {
      document.documentElement.lang = savedLanguage;
      updateContactsContent(savedLanguage);
      console.log('Inherited language setting:', savedLanguage);
    }

<script>
  // Listen for language changes from the language-switcher.js
  document.addEventListener('DOMContentLoaded', function() {
    // Wait for language selector to be created
    setTimeout(function() {
      const languageSelect = document.getElementById('language');
      if (languageSelect) {
        // Override the language change event to also update contacts content
        languageSelect.addEventListener('change', function(event) {
          const selectedLanguage = event.target.value;
          // Store in localStorage (this is also done in language-switcher.js but ensuring it's set)
          localStorage.setItem('selectedLanguage', selectedLanguage);
          document.documentElement.lang = selectedLanguage;
          updateContactsContent(selectedLanguage);
        });
        
        // Set initial value from localStorage
        const savedLanguage = localStorage.getItem('selectedLanguage') || 'bg';
        languageSelect.value = savedLanguage;
      }
    }, 200);
    
    // Removed form submission handlers as forms are removed
  });
</script>
