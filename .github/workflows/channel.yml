# Viber / Telegram канал: проверка и тестово съобщение (ръчно пускане, когато токените са сложени в Secrets).
name: Channel

on:
  workflow_dispatch:
    inputs:
      action:
        description: "check – кои канали са настроени; test – тестово съобщение; viber-info – име и членове на Viber канала"
        required: true
        default: check
        type: choice
        options: [check, test, viber-info]

permissions:
  contents: read

defaults:
  run:
    working-directory: tools/social

jobs:
  channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          case "${{ inputs.action }}" in
            test) python main.py channel --test ;;
            viber-info) python main.py channel --viber-info ;;
            *) python main.py channel ;;
          esac
        env:
          WP_VIBER_TOKEN: ${{ secrets.WP_VIBER_TOKEN }}
          WP_VIBER_FROM: ${{ secrets.WP_VIBER_FROM }}
          WP_TG_TOKEN: ${{ secrets.WP_TG_TOKEN }}
          WP_TG_CHAT: ${{ secrets.WP_TG_CHAT }}
