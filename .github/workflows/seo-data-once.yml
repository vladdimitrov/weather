name: SEO data (one-off, branch seo-priorities)

# Runs once on the seo-priorities branch, where the network is available, and commits back to
# the branch: record temperatures (build-climate.js --records, Bulgaria and Europe, including
# the Europe cities that had no climate yet), the holidays from Nager.Date, today's forecast in
# every city page and NOAA's storm data. Delete this file before merging.
on:
  push:
    branches: [seo-priorities]
    paths: ['.github/workflows/seo-data-once.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-priorities
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Record temperatures, Bulgaria
        continue-on-error: true
        run: node .github/scripts/build-climate.js --records
      # The free archive API stops answering after about 50 ten-year requests an hour; what was
      # fetched is kept (climate-europe.json is saved city by city) and the next run goes on
      - name: Climate and record temperatures, Europe
        continue-on-error: true
        timeout-minutes: 60
        run: node .github/scripts/build-climate.js --europe --records
      - name: Pages
        run: |
          node .github/scripts/build-pages.js
          node .github/scripts/build-europe.js
          node .github/scripts/build-extra.js
      - name: Forecast
        run: node .github/scripts/build-forecast.js
      - name: Storms
        continue-on-error: true
        run: node .github/scripts/build-storms.js
      - name: Sitemap and check
        run: |
          node .github/scripts/build-sitemap.js
          node .github/scripts/check-site.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing changed."; exit 0; }
          git commit -m "Climate records, forecast and storm data for the new pages"
          git push origin HEAD:seo-priorities
