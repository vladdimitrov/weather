name: Site check

# Checks every pull request and push to main for missing files and
# JavaScript/JSON errors before they reach the live site (.github/scripts/check-site.js)
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Translated home and storms pages are up to date
        run: |
          node .github/scripts/build-main.js
          git diff --exit-code -- en/index.html de/index.html it/index.html es/index.html '*/magnitni-buri/index.html'
      - run: node .github/scripts/check-site.js
      - run: node .github/scripts/test-moon.js
      - run: node .github/scripts/test-sun.js
