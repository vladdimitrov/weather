name: Daily forecast in the city pages

# Every morning: writes today's forecast into the HTML of the city pages (Bulgaria and Europe)
# (.github/scripts/build-forecast.js) and the storm forecast into /magnitni-buri/ and its Bulgarian
# pages (build-storms.js), refreshes sitemap.xml (build-sitemap.js: <lastmod> changes only for pages
# whose content changed, not for a new forecast) and commits to main.
# Also runs when the city pages are regenerated on main (build-pages.js writes them with a
# "Loading…" line) and by hand ("Run workflow"). If Open-Meteo does not answer, the run
# fails and the pages keep the forecast of the day before.
on:
  schedule:
    # 03:20 UTC = 05:20 in Sofia in winter, 06:20 in summer
    - cron: '20 3 * * *'
  push:
    branches: [main]
    paths:
      - 'vremeto/**'
      - '*/vremeto/**'
      - 'europe/**'
      - '*/europe/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: forecast-daily
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write the forecast
        run: node .github/scripts/build-forecast.js
      # NOAA's 3-day forecast in /magnitni-buri/; the city pages are still committed if it fails
      - name: Write the storm forecast
        continue-on-error: true
        run: node .github/scripts/build-storms.js
      - name: Update the sitemap
        run: node .github/scripts/build-sitemap.js
      - run: node .github/scripts/check-site.js
      - name: Commit
        id: commit
        run: |
          git add vremeto en/vremeto de/vremeto it/vremeto es/vremeto europe en/europe de/europe it/europe es/europe magnitni-buri en/magnitni-buri de/magnitni-buri it/magnitni-buri es/magnitni-buri sitemap.xml .github/scripts/sitemap-hashes.json .github/scripts/storms-data.json
          if git diff --cached --quiet; then
            echo "Nothing changed."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Forecast of $(date -u +%F) in the city pages"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # A push made by Actions may not start the Pages build by itself: ask for it
      - name: Publish
        if: steps.commit.outputs.pushed == 'true'
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
