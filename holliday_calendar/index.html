  <script>
    (function() {
      const savedLanguage = localStorage.getItem('selectedLanguage') || 'bg';
      document.documentElement.lang = savedLanguage;
      // Hidden until translated from the Bulgarian HTML (no flash of Bulgarian text)

  <style>
    @keyframes fade-in {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }
    
    #hourlyTableBlock {
      transition: max-height 0.5s ease-out, opacity 0.5s ease;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
    }
    
    @media (max-width: 768px) {
      #hourlyTableBlock {
        padding: 0 5px;
      }
      #hourlyTableBlock h2 {
        font-size: 1.5em;
      }
    }
    .spinner {
      display: inline-block;
      width: 1em;
      height: 1em;
      border: 2px solid #FFD700;
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 6px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #kp-summary .kp-icon {
      font-size: 2em; /* Increased font size to make the icon more prominent */
      margin-right: 6px;
    }
  </style>

<body style="font-family: 'Orbitron', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">

  <div class="nav-header" tabindex="-1" id="header">
    <div class="nav-links">
      <a href="../index.html" class="nav-link" data-nav="home">Начало</a>
   <a href="../weather/index.html" class="nav-link" data-nav="weather">Прогноза за времето</a>
      <a href="../maps/index.html" class="nav-link" data-nav="maps">Карти за времето</a>
      <a href="../magnitni-buri/" class="nav-link" data-nav="storms">Магнитни бури</a>
      <a href="../contacts/index.html" class="nav-link" data-nav="sources">Източници на данни</a>
     </div>
    <div class="header-selectors" id="selectors-container">
      <!-- Background and language selectors will be inserted here by JS -->
    </div>
  </div>

  <div class="container" style="margin-top: calc(var(--header-height) + 20px);">
    <h1 style="text-align: center;" data-translation-key="holidayCalendarTitle">Календар на празниците</h1>
    <p class="city-actions"><a class="btn" href="/praznici/" data-nav="holidaysBg">Официални празници в България</a></p>

    <div style="display: flex; flex-direction: column; align-items: center; margin-top: 10px;">
      <div class="form-container">
      <div class="form-group city">
        <label for="city" data-translation-key="cityLabel">Град / Курорт:</label>
        <input type="text" id="city" data-translation-key="cityPlaceholder" placeholder="e.g. Sofia">
        <div id="citySuggestions" style="display: none;"></div>
      </div>

      <div class="form-group latitude">
        <label for="latitude" data-translation-key="latitudeLabel">Географска ширина:</label>
        <input type="number" id="latitude" placeholder="e.g. 42.6977">
      </div>

      <div class="form-group longitude">
        <label for="longitude" data-translation-key="longitudeLabel">Географска дължина:</label>
        <input type="number" id="longitude" placeholder="e.g. 23.3219">
      </div>


      <div class="form-group fromDate">
        <label for="fromDate" data-translation-key="fromDateLabel">От дата:</label>
        <input type="date" id="fromDate">
      </div>

      <div class="form-group toDate">
        <label for="toDate" data-translation-key="toDateLabel">До дата:</label>
        <input type="date" id="toDate">
      </div>
      
      <div class="buttons-container">
        <button id="useLocation" class="btn btn-location" data-translation-key="useLocationButton">📍 Използвай текущото местоположение</button>
        <button id="loadData" class="btn btn-primary pulse" data-translation-key="loadHolidaysButton">Зареди празниците</button>
      </div>
      </div>
    <div style="display: flex; justify-content: center; align-items: baseline; margin-top: 10px;">
      <div id="selected-city" style="font-weight: bold; font-size: 1.1em; color: #FFD700; margin-right: 10px;"></div>
      <div id="local-time" style="display: inline-block;"></div>
    </div>
    <div id="calendar" style="max-width: 800px; margin: 20px auto; background: rgba(28, 46, 74, 0.8); border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 10px; padding: 20px; box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);">
      <!-- Calendar will be generated here -->
    </div>

    <div id="holidayDetails">
      <!-- Holiday details will be displayed here -->
    </div>

    <div style="text-align: center; margin-top: 20px; margin-bottom: 60px;">
      <button onclick="window.print()" class="btn" data-translation-key="printButton">🖨️ Печат</button>
    </div>

  </div>

  <footer style="background: var(--card-bg); border-top: 1px solid var(--card-border); padding: 10px; box-shadow: var(--shadow-glow); position: fixed; bottom: 0; left: 0; width: 100%; margin-top: 0; height: var(--footer-height); z-index: 100; display: flex; align-items: center; justify-content: space-between;">
    <div class="logo" style="flex-shrink: 0;">
        <a href="../index.html"><img src="../images/logo-64.webp" alt="Лого" class="logo-img" width="30" height="30" style="height: 30px; width: auto;"></a>
    </div>
      
    <p style="font-size: 0.8em; color: #999; margin: 0; text-align: center; flex-grow: 1;">

      · <a href="/poveritelnost/" class="footer-link" data-nav="privacy">Поверителност</a>
    </p>

  </footer>
