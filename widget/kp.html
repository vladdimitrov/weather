<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Магнитни бури — Weather Pulse</title>
  <!-- Embeddable card for other sites: <iframe src="https://weatherpulse.eu/widget/kp.html" width="320" height="190">.
       Self-contained (no site scripts, no cookies or analytics). ?lang=en, de, it or es for other languages. -->
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #ffffff;
    }
    a.card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      height: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(255, 215, 0, 0.45);
      border-radius: 14px;
      background: #162447;
      color: inherit;
      text-decoration: none;
    }
    .title { color: #FFD700; font-weight: 700; font-size: 15px; }
    .now { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .now b { font-size: 26px; }
    .scale { display: inline-flex; gap: 2px; }
    .scale span { width: 7px; height: 13px; border-radius: 2px; background: rgba(255, 255, 255, 0.18); }
    .scale span.calm { background: #2ecc71; }
    .scale span.active { background: #f1c40f; }
    .scale span.storm { background: #e74c3c; }
    .days { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 12px; text-align: center; }
    .days div { padding: 4px 2px; border-radius: 8px; background: rgba(255, 255, 255, 0.08); }
    .days .name { display: block; color: #FFD700; text-transform: capitalize; }
    .days .storm-day { background: rgba(231, 76, 60, 0.35); }
    .footer { margin-top: auto; font-size: 11px; color: rgba(255, 255, 255, 0.7); text-align: right; }
  </style>
</head>
<body>
  <a class="card" id="card" href="https://weatherpulse.eu/magnitni-buri/" target="_blank" rel="noopener">
    <span class="title" id="title">🧭 Магнитни бури</span>
    <span class="now" id="now">…</span>
    <span class="days" id="days"></span>
    <span class="footer">weatherpulse.eu</span>
  </a>
  <script>
    (function () {
      const texts = {
        bg: { title: '🧭 Магнитни бури', now: 'Kp сега', today: 'Днес', tomorrow: 'Утре', calm: 'спокойно', active: 'повишено', storm: 'буря', error: 'Няма данни в момента', locale: 'bg-BG' },
        en: { title: '🧭 Magnetic storms', now: 'Kp now', today: 'Today', tomorrow: 'Tomorrow', calm: 'calm', active: 'active', storm: 'storm', error: 'Data unavailable', locale: 'en-GB' },
        de: { title: '🧭 Magnetstürme', now: 'Kp aktuell', today: 'Heute', tomorrow: 'Morgen', calm: 'ruhig', active: 'erhöht', storm: 'Sturm', error: 'Keine Daten verfügbar', locale: 'de-DE' },
        it: { title: '🧭 Tempeste magnetiche', now: 'Kp ora', today: 'Oggi', tomorrow: 'Domani', calm: 'calmo', active: 'elevato', storm: 'tempesta', error: 'Dati non disponibili', locale: 'it-IT' },
        es: { title: '🧭 Tormentas magnéticas', now: 'Kp ahora', today: 'Hoy', tomorrow: 'Mañana', calm: 'tranquilo', active: 'elevado', storm: 'tormenta', error: 'Sin datos por ahora', locale: 'es-ES' }
      };
      const requested = new URLSearchParams(location.search).get('lang');
      const language = texts[requested] ? requested : 'bg';
      const t = texts[language];
      document.documentElement.lang = language;
      document.getElementById('title').textContent = t.title;

      const level = kp => kp >= 5 ? 'storm' : kp >= 4 ? 'active' : 'calm';
      const scale = kp => '<span class="scale">' + Array.from({ length: 10 }, (_, i) => `<span class="${i <= Math.round(kp) ? (i >= 7 ? 'storm' : i >= 5 ? 'active' : 'calm') : ''}"></span>`).join('') + '</span>';

      Promise.all([
        fetch('https://services.swpc.noaa.gov/json/planetary_k_index_1m.json').then(r => r.json()),
        fetch('https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json').then(r => r.json())
      ]).then(([now, forecast]) => {
        const last = now[now.length - 1];
        const kpNow = Math.round(parseFloat(last.estimated_kp ?? last.kp_index) * 10) / 10;
        document.getElementById('now').innerHTML = `${t.now}: <b>${kpNow}</b> ${scale(kpNow)} ${t[level(kpNow)]}`;

        const start = new Date(); start.setHours(0, 0, 0, 0);
        const days = [];
        forecast.forEach(entry => {
          const time = new Date(String(entry.time_tag) + 'Z');
          const kp = parseFloat(entry.kp);
          if (time < start || isNaN(kp)) return;
          const key = time.toLocaleDateString(t.locale);
          let day = days.find(d => d.key === key);
          if (!day) { if (days.length === 3) return; day = { key, time, kp: 0 }; days.push(day); }
          day.kp = Math.max(day.kp, kp);
        });
        document.getElementById('days').innerHTML = days.map((day, i) => {
          const name = i === 0 ? t.today : i === 1 ? t.tomorrow : day.time.toLocaleDateString(t.locale, { weekday: 'long' });
          const kp = Math.round(day.kp * 10) / 10;
          return `<div class="${kp >= 5 ? 'storm-day' : ''}"><span class="name">${name}</span>Kp ${kp}</div>`;
        }).join('');
      }).catch(() => {
        document.getElementById('now').textContent = t.error;
      });
    })();
  </script>
</body>
</html>
