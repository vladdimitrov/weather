<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found - Weather Pulse</title>
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet"></noscript>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      font-family: 'Orbitron', sans-serif;
      color: #fff;
      text-align: center;
    }
    .box {
      max-width: 520px;
    }
    .box img {
      width: 120px;
      height: auto;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 72px;
      color: #FFD700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
    }
    p {
      margin: 12px 0;
      line-height: 1.5;
    }
    a.btn {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 24px;
      border: 2px solid #FFD700;
      border-radius: 24px;
      color: #FFD700;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }
    a.btn:hover {
      background: #FFD700;
      color: #0072ff;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="/images/logo-256.webp" alt="Weather Pulse" width="120" height="120">
    <h1>404</h1>
    <p>Page not found.</p>
    <p>Страницата не е намерена.</p>
    <a class="btn" href="/">Home / Начало</a>
  </div>
</body>
</html>
